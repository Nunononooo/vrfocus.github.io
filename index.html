<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
  <style>
    body { margin: 0; }
    #viewer { width: 100vw; height: 100dvh; }

    #breath-guide {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; text-align: center; color: white; font-size: 14px;
      display: none;
    }
    #breath-circle {
      width: 80px; height: 80px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      margin: 0 auto 12px;
      animation: breathe var(--breath-cycle, 10s) ease-in-out infinite;
      position: relative;
    }
    .breath-label {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px; color: rgba(255,255,255,0.9);
      white-space: nowrap;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.6); opacity: 0.9; }
    }
    .scene-btn.active, .mode-btn.active {
      background: rgba(255,255,255,0.95) !important;
      font-weight: bold;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
      "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
      "@photo-sphere-viewer/gyroscope-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gyroscope-plugin/index.module.js",
      "@photo-sphere-viewer/stereo-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/stereo-plugin/index.module.js"
    }
  }
  </script>

  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';
    import { GyroscopePlugin } from '@photo-sphere-viewer/gyroscope-plugin';
    import { StereoPlugin } from '@photo-sphere-viewer/stereo-plugin';

    const scenes = {
      forest: {
        name: '森林晨雾',
        panorama: 'panorama.jpg',
        audio: '792342__klankbeeld__park-forest-haanwijk-1141-am-250306_1056_cut1.mp3',
      },
      beach: {
        name: '海边落日',
        panorama: 'panorama2.png',
        audio: '727488__nicotep__seaside_trevoutreguignec_closer.mp3',
      },
      campfire: {
        name: '深夜篝火',
        panorama: 'panorama3.png',
        audio: '213804__craftcrestcom__campfire-in-the-woods-rear.mp3',
      },
    };

    const breathModes = {
      standard: { label: '标准（4秒吸气 / 6秒呼气）', cycle: 10000, inhale: 5000 },
      quick:    { label: '快速（3秒吸气 / 4秒呼气）', cycle: 7000,  inhale: 3000 },
    };
    let currentBreathMode = 'standard';

    let currentScene = 'forest';
    const savedScene = localStorage.getItem('opc_scene');
    if (savedScene && scenes[savedScene]) {
      currentScene = savedScene;
    }

    const viewer = new Viewer({
      container: document.querySelector('#viewer'),
      panorama: scenes[currentScene].panorama,
      caption: '5分钟专注恢复',
      loadingTxt: '加载中...',
      navbar: ['zoom', 'caption', 'gyroscope', 'stereo'],
      plugins: [GyroscopePlugin, StereoPlugin],
    });

    // 陀螺仪权限请求（iOS 需要用户手势触发）
    const gyroBtn = document.querySelector('[data-psv-button="gyroscope"]');
    if (gyroBtn) {
      gyroBtn.addEventListener('click', async () => {
        if (typeof DeviceOrientationEvent !== 'undefined'
            && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
              console.warn('陀螺仪权限被拒绝');
            }
          } catch (err) {
            console.warn('陀螺仪权限请求失败:', err);
          }
        }
      });
    }

    const audio = new Audio(scenes[currentScene].audio);
    audio.loop = true;
    audio.preload = 'auto';
    audio.volume = 0.7;

    let sessionTimer = null;
    let sessionActive = false;
    let breathTextTimer = null;
    let sessionStartTime = 0;

    function updateStartButtonText() {
      const btn = document.getElementById('start-btn');
      if (btn) {
        btn.textContent = `开始 5 分钟体验 · ${scenes[currentScene].name}`;
      }
    }

    function fadeOutAudio(duration) {
      const step = 50;
      const steps = Math.max(1, Math.floor(duration / step));
      const startVolume = audio.volume;
      let i = 0;
      const timer = setInterval(() => {
        i++;
        audio.volume = Math.max(0, startVolume * (1 - i / steps));
        if (i >= steps) {
          clearInterval(timer);
          audio.pause();
          audio.volume = startVolume;
        }
      }, step);
    }

    function startBreathTextLoop() {
      const circle = document.getElementById('breath-circle');
      if (!circle) return;

      let label = circle.querySelector('.breath-label');
      if (!label) {
        label = document.createElement('span');
        label.className = 'breath-label';
        circle.appendChild(label);
      }

      const update = () => {
        const mode = breathModes[currentBreathMode];
        const elapsed = performance.now() - sessionStartTime;
        const t = elapsed % mode.cycle;
        label.textContent = t < mode.inhale ? '吸气' : '呼气';
      };

      update();
      stopBreathTextLoop();
      breathTextTimer = setInterval(update, 100);
    }

    function stopBreathTextLoop() {
      if (breathTextTimer) {
        clearInterval(breathTextTimer);
        breathTextTimer = null;
      }
    }

    function switchScene(key) {
      if (!scenes[key] || key === currentScene) return;

      if (sessionActive) {
        sessionActive = false;
        if (sessionTimer) {
          clearTimeout(sessionTimer);
          sessionTimer = null;
        }
        audio.pause();
        audio.volume = 0.7;
        stopBreathTextLoop();
        sessionStartTime = 0;
        document.getElementById('breath-guide').style.display = 'none';
        document.getElementById('end-message').style.display = 'none';
        document.getElementById('start-overlay').style.display = 'flex';
      }

      currentScene = key;
      const scene = scenes[key];

      viewer.setPanorama(scene.panorama).catch(err => console.warn('全景图加载失败:', err));

      audio.pause();
      audio.src = scene.audio;
      audio.load();
      audio.volume = 0.7;

      document.querySelectorAll('.scene-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scene === key);
      });

      localStorage.setItem('opc_scene', key);

      updateStartButtonText();
    }

    function switchBreathMode(mode) {
      if (!breathModes[mode] || mode === currentBreathMode) return;
      currentBreathMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      updateBreathModeHint();
    }
    window.switchBreathMode = switchBreathMode;

    function startSession() {
      if (sessionActive) return;
      sessionActive = true;

      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('breath-guide').style.display = 'block';

      sessionStartTime = performance.now();

      const circle = document.getElementById('breath-circle');
      if (circle) {
        const mode = breathModes[currentBreathMode];
        circle.style.setProperty('--breath-cycle', `${mode.cycle / 1000}s`);
        circle.style.animation = 'none';
        void circle.offsetWidth;
        circle.style.animation = '';
      }

      audio.currentTime = 0;
      audio.play().catch(err => console.warn('音频播放失败:', err));

      startBreathTextLoop();

      sessionTimer = setTimeout(endSession, 60 * 1000);
    }

    function endSession() {
      sessionActive = false;
      fadeOutAudio(500);
      stopBreathTextLoop();
      document.getElementById('breath-guide').style.display = 'none';
      document.getElementById('end-message').style.display = 'flex';
    }

    window.switchScene = switchScene;

    updateStartButtonText();
    document.querySelectorAll('.scene-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.scene === currentScene);
    });
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === currentBreathMode);
    });
    updateBreathModeHint();

    document.getElementById('start-btn').addEventListener('click', startSession);

    document.getElementById('restart-btn').addEventListener('click', () => {
      if (sessionTimer) {
        clearTimeout(sessionTimer);
        sessionTimer = null;
      }
      audio.pause();
      audio.volume = 0.7;
      audio.currentTime = 0;

      document.getElementById('end-message').style.display = 'none';
      document.getElementById('start-overlay').style.display = 'flex';
      sessionActive = false;

      startSession();
    });

    function updateBreathModeHint() {
  const hint = document.getElementById('breath-mode-hint');
  if (hint) {
    hint.textContent = breathModes[currentBreathMode].label;
  }
}
  </script>

  <div id="breath-guide">
    <div id="breath-circle"></div>
  </div>

  <div id="scene-switcher" style="position:fixed; top:16px; right:16px; z-index:20;
    display:flex; flex-direction:column; gap:8px;">
    <button class="scene-btn" data-scene="forest" onclick="switchScene('forest')"
      style="padding:8px 14px; font-size:13px; border-radius:6px; border:none;
      cursor:pointer; background:rgba(255,255,255,0.6); color:#222;">森林晨雾</button>
    <button class="scene-btn" data-scene="beach" onclick="switchScene('beach')"
      style="padding:8px 14px; font-size:13px; border-radius:6px; border:none;
      cursor:pointer; background:rgba(255,255,255,0.6); color:#222;">海边落日</button>
    <button class="scene-btn" data-scene="campfire" onclick="switchScene('campfire')"
      style="padding:8px 14px; font-size:13px; border-radius:6px; border:none;
      cursor:pointer; background:rgba(255,255,255,0.6); color:#222;">深夜篝火</button>
  </div>

  <div id="start-overlay" style="position:fixed; inset:0; display:flex; align-items:center;
    justify-content:center; flex-direction:column; background:rgba(0,0,0,0.35); z-index:10;">
    <div id="breath-mode-switcher" style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
  <button class="mode-btn" data-mode="standard" onclick="switchBreathMode('standard')"
    style="padding:6px 12px; font-size:12px; border-radius:6px; border:none;
    cursor:pointer; background:rgba(255,255,255,0.6); color:#222;">标准节奏</button>
  <button class="mode-btn" data-mode="quick" onclick="switchBreathMode('quick')"
    style="padding:6px 12px; font-size:12px; border-radius:6px; border:none;
    cursor:pointer; background:rgba(255,255,255,0.6); color:#222;">快速节奏</button>
  <span id="breath-mode-hint" style="font-size:12px; color:rgba(255,255,255,0.85);"></span>
  </div>
    <button id="start-btn" style="padding:14px 32px; font-size:16px; border-radius:8px;
      border:none; cursor:pointer; background:rgba(255,255,255,0.9); color:#222;">
      开始 5 分钟体验
    </button>
  </div>

  <div id="end-message" style="position:fixed; inset:0; display:none; align-items:center;
    justify-content:center; background:rgba(0,0,0,0.45); z-index:10; color:#fff;
    text-align:center; flex-direction:column; gap:16px;">
    <p style="font-size:18px;">本次体验完成</p>
    <p style="font-size:13px; opacity:0.8;">慢慢睁开眼睛，回到当下</p>
    <button id="restart-btn" style="padding:10px 24px; font-size:14px; border-radius:8px;
      border:none; cursor:pointer; background:rgba(255,255,255,0.9); color:#222;">
      再来一次
    </button>
  </div>

</body>
</html>
